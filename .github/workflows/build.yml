name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [InMemory, PostgreSql]
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      PAPIRFLY_TEST_Storage__Provider: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore PapirFly.sln --locked-mode

      - name: Build
        run: dotnet build PapirFly.sln --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/PapirFly.UnitTests/PapirFly.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Alba integration tests
        run: >-
          dotnet test tests/PapirFly.IntegrationTests/PapirFly.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.storage }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
